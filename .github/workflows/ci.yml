name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n gre-manager install.sh quick-install.sh uninstall.sh
          test "$(bash gre-manager version)" = "$(cat VERSION)"
          bash gre-manager help >/dev/null
          ! LC_ALL=C.UTF-8 grep -Pn '[\x{0600}-\x{06FF}]' gre-manager install.sh quick-install.sh README.md
          grep -q 'IRAN' gre-manager
          grep -q 'KHAREJ' gre-manager
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .

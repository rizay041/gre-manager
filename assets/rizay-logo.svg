<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RIZAY GRE Manager</title>
  <desc id="desc">Blue dotted RIZAY logo connecting IRAN and KHAREJ servers</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#071a3d"/>
      <stop offset="1" stop-color="#061a33"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".38"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.5" fill="#38bdf8"/>
      <circle cx="10" cy="10" r="1.7" fill="#2563eb"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <ellipse cx="600" cy="175" rx="500" ry="210" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="384" rx="25" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="2 13"/>
  <text x="600" y="205" text-anchor="middle" font-family="DejaVu Sans Mono,monospace" font-size="170" font-weight="900" letter-spacing="14" fill="url(#dots)" stroke="#60a5fa" stroke-width="1" filter="url(#softGlow)">RIZAY</text>
  <text x="600" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="12" fill="#7dd3fc">GRE MANAGER</text>
  <path d="M300 330 H530 M670 330 H900" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 16"/>
  <circle cx="250" cy="330" r="44" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="950" cy="330" r="44" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
  <rect x="530" y="302" width="140" height="56" rx="28" fill="#1d4ed8" stroke="#7dd3fc" stroke-width="2"/>
  <text x="250" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e0f2fe">IRAN</text>
  <text x="600" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="white">v3.0.1</text>
  <text x="950" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e0f2fe">KHAREJ</text>
</svg>
